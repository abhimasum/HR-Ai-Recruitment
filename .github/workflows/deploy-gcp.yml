name: Deploy HR Recruitment App to GCP

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/terraform/gcp/**"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hr-recruitment-gcp-${{ vars.GCP_PROJECT_ID || 'hr-ai-recruitment' }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'hr-ai-recruitment' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  AR_REPO: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY || 'hr-repo' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Validate app before deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend workflow tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-package-lock
          npm run build

  deploy:
    name: Provision, deploy, and smoke test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate required GitHub configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
          INITIAL_ACCOUNTS_JSON: ${{ secrets.HR_INITIAL_ACCOUNTS_JSON }}
        run: |
          set -euo pipefail
          if [ "${PROJECT_ID}" != "hr-ai-recruitment" ]; then
            echo "::error::This workflow is configured only for project hr-ai-recruitment."
            exit 1
          fi
          for name in PROJECT_ID WIF_PROVIDER DEPLOYER_SERVICE_ACCOUNT STATE_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub variable is missing: ${name}"
              exit 1
            fi
          done
          if [ -z "${INITIAL_ACCOUNTS_JSON}" ]; then
            echo "::error::Set the HR_INITIAL_ACCOUNTS_JSON repository secret."
            exit 1
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Python for deployment smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify target GCP project
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          if [ "${project_number}" != "278189990066" ]; then
            echo "::error::Expected hr-ai-recruitment project number 278189990066; received ${project_number}."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Initialize Terraform with GCS state
        working-directory: infra/terraform/gcp
        env:
          TF_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
        run: |
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Set the GCP_TERRAFORM_STATE_BUCKET repository variable to an existing GCS bucket."
            exit 1
          fi
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=hr-ai-recruitment/${PROJECT_ID}"

      - name: Validate Terraform configuration
        working-directory: infra/terraform/gcp
        run: terraform validate

      - name: Create Artifact Registry repository
        working-directory: infra/terraform/gcp
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_deployer_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          TF_VAR_artifact_registry_repository: ${{ env.AR_REPO }}
          TF_VAR_backend_image: bootstrap.invalid/hr-backend:bootstrap
          TF_VAR_frontend_image: bootstrap.invalid/hr-frontend:bootstrap
          TF_VAR_db_password: ${{ secrets.HR_DB_PASSWORD }}
          TF_VAR_db_admin_password: ${{ secrets.HR_DB_ADMIN_PASSWORD }}
          TF_VAR_openai_api_key: ${{ secrets.HR_OPENAI_API_KEY }}
        run: |
          if [ -z "${TF_VAR_db_password}" ]; then
            echo "::error::Set the HR_DB_PASSWORD repository secret."
            exit 1
          fi
          terraform apply \
            -target=google_artifact_registry_repository.images \
            -auto-approve

      - name: Build and push backend image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/hr-backend:${{ github.sha }}
        run: |
          docker build --pull \
            --build-arg EMBEDDING_PROVIDER="${{ vars.HR_EMBEDDING_PROVIDER || 'vertexai' }}" \
            -t "${IMAGE}" backend
          docker push "${IMAGE}"
          echo "BACKEND_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Build and push frontend image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/hr-frontend:${{ github.sha }}
        run: |
          docker build --pull -t "${IMAGE}" frontend
          docker push "${IMAGE}"
          echo "FRONTEND_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Prepare Cloud SQL database and admin password
        working-directory: infra/terraform/gcp
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_artifact_registry_repository: ${{ env.AR_REPO }}
          TF_VAR_backend_image: bootstrap.invalid/hr-backend:bootstrap
          TF_VAR_frontend_image: bootstrap.invalid/hr-frontend:bootstrap
          TF_VAR_db_password: ${{ secrets.HR_DB_PASSWORD }}
          TF_VAR_db_admin_password: ${{ secrets.HR_DB_ADMIN_PASSWORD }}
          DB_ADMIN_PASSWORD: ${{ secrets.HR_DB_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_ADMIN_PASSWORD}" ]; then
            echo "::error::Set the HR_DB_ADMIN_PASSWORD repository secret."
            exit 1
          fi
          terraform apply \
            -target=google_sql_database_instance.db \
            -target=google_sql_database.hr \
            -target=google_sql_user.hr \
            -auto-approve
          gcloud sql users set-password postgres \
            --instance=hr-postgres \
            --project="${PROJECT_ID}" \
            --password="${DB_ADMIN_PASSWORD}"

      - name: Create app authentication secrets
        working-directory: infra/terraform/gcp
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_deployer_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          TF_VAR_artifact_registry_repository: ${{ env.AR_REPO }}
          TF_VAR_backend_image: bootstrap.invalid/hr-backend:bootstrap
          TF_VAR_frontend_image: bootstrap.invalid/hr-frontend:bootstrap
          TF_VAR_db_password: ${{ secrets.HR_DB_PASSWORD }}
          TF_VAR_db_admin_password: ${{ secrets.HR_DB_ADMIN_PASSWORD }}
          INITIAL_ACCOUNTS_JSON: ${{ secrets.HR_INITIAL_ACCOUNTS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${INITIAL_ACCOUNTS_JSON}" ]; then
            echo "::error::Set the HR_INITIAL_ACCOUNTS_JSON repository secret using set-initial-accounts.ps1."
            exit 1
          fi
          terraform apply \
            -target=google_secret_manager_secret.auth_signing_key \
            -target=google_secret_manager_secret.initial_accounts \
            -target=google_secret_manager_secret_iam_member.backend_auth_signing_key \
            -target=google_secret_manager_secret_iam_member.bootstrap_initial_accounts \
            -target=google_project_iam_member.deployer_secret_manager_admin \
            -auto-approve

          if ! gcloud secrets versions list hr-auth-signing-key \
            --project="${PROJECT_ID}" \
            --filter="state=ENABLED" --format="value(name)" | grep -q .; then
            openssl rand -hex 32 |
              gcloud secrets versions add hr-auth-signing-key \
                --project="${PROJECT_ID}" --data-file=-
          fi
          enabled_versions="$(gcloud secrets versions list hr-initial-accounts \
            --project="${PROJECT_ID}" \
            --filter="state=ENABLED" --format="value(name)")"
          new_accounts_hash="$(printf '%s' "${INITIAL_ACCOUNTS_JSON}" | sha256sum | cut -d ' ' -f 1)"
          if [ -z "${enabled_versions}" ]; then
            printf '%s' "${INITIAL_ACCOUNTS_JSON}" |
              gcloud secrets versions add hr-initial-accounts \
                --project="${PROJECT_ID}" --data-file=-
          else
            current_accounts_hash="$(gcloud secrets versions access latest \
              --secret=hr-initial-accounts \
              --project="${PROJECT_ID}" | sha256sum | cut -d ' ' -f 1)"
            if [ "${new_accounts_hash}" != "${current_accounts_hash}" ]; then
              printf '%s' "${INITIAL_ACCOUNTS_JSON}" |
                gcloud secrets versions add hr-initial-accounts \
                  --project="${PROJECT_ID}" --data-file=-
            fi
          fi

      - name: Plan and apply infrastructure and Cloud Run deployment
        working-directory: infra/terraform/gcp
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_deployer_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          TF_VAR_artifact_registry_repository: ${{ env.AR_REPO }}
          TF_VAR_backend_image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/hr-backend:${{ github.sha }}
          TF_VAR_frontend_image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/hr-frontend:${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.HR_DB_PASSWORD }}
          TF_VAR_db_admin_password: ${{ secrets.HR_DB_ADMIN_PASSWORD }}
          TF_VAR_openai_api_key: ${{ secrets.HR_OPENAI_API_KEY }}
          TF_VAR_llm_provider: ${{ vars.HR_LLM_PROVIDER || 'vertexai' }}
          TF_VAR_llm_model: ${{ vars.HR_LLM_MODEL || 'gemini-3.8-flash' }}
          TF_VAR_vertex_ai_location: ${{ vars.HR_VERTEX_AI_LOCATION || 'global' }}
          TF_VAR_vertex_ai_embedding_location: ${{ vars.HR_VERTEX_AI_EMBEDDING_LOCATION || 'us-central1' }}
          TF_VAR_embedding_provider: ${{ vars.HR_EMBEDDING_PROVIDER || 'vertexai' }}
          TF_VAR_embedding_model: ${{ vars.HR_EMBEDDING_MODEL || 'text-embedding-004' }}
          TF_VAR_embedding_dim: ${{ vars.HR_EMBEDDING_DIM || '768' }}
          TF_VAR_min_instances: "0"
          TF_VAR_database_tier: ${{ vars.HR_DATABASE_TIER || 'db-f1-micro' }}
          TF_VAR_deletion_protection: "true"
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
          echo "FRONTEND_URL=$(terraform output -raw frontend_url)" >> "${GITHUB_ENV}"
          echo "API_URL=$(terraform output -raw api_url)" >> "${GITHUB_ENV}"

      - name: Seed application login accounts
        run: |
          gcloud run jobs execute hr-account-bootstrap \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

      - name: Smoke test deployed frontend and API
        env:
          INITIAL_ACCOUNTS_JSON: ${{ secrets.HR_INITIAL_ACCOUNTS_JSON }}
        run: |
          set -euo pipefail
          echo "Checking frontend at ${FRONTEND_URL}"
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 \
            "${FRONTEND_URL}/" -o /dev/null

          echo "Checking backend health"
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 \
            "${API_URL}/health"

          echo "Checking login, protected jobs, and policy RAG through the frontend proxy"
          python - <<'PY'
          import http.cookiejar
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["FRONTEND_URL"] + "/api/v1"
          accounts = json.loads(os.environ["INITIAL_ACCOUNTS_JSON"])
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          request = urllib.request.Request(
              base + "/auth/login",
              data=json.dumps({"username": "candidate1", "password": accounts["candidate1"]}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with opener.open(request, timeout=30) as response:
              account = json.load(response)
          assert account["role"] == "candidate", "candidate login returned the wrong role"

          with opener.open(base + "/jobs", timeout=30) as response:
              jobs = json.load(response)
          assert isinstance(jobs, list) and jobs, "no open jobs returned after login"
          with opener.open(base + "/screening/me", timeout=30) as response:
              applications = json.load(response)
          assert isinstance(applications, list), "candidate applications endpoint returned an invalid response"
          request = urllib.request.Request(
              base + "/auth/login",
              data=json.dumps({"username": "test", "password": accounts["test"]}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with opener.open(request, timeout=30) as response:
              test_account = json.load(response)
          assert test_account["role"] == "candidate", "test login returned the wrong role"
          try:
              opener.open(base + "/jobs/summary", timeout=30)
          except urllib.error.HTTPError as error:
              assert error.code == 403, "candidate HR access returned an unexpected status"
          else:
              raise AssertionError("candidate account was able to access HR job summaries")
          print(f"Candidate and test logins passed; {len(jobs)} open job(s) returned.")

          hr_opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          request = urllib.request.Request(
              base + "/auth/login",
              data=json.dumps({"username": "hr", "password": accounts["hr"]}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with hr_opener.open(request, timeout=30) as response:
              account = json.load(response)
          assert account["role"] == "hr", "HR login returned the wrong role"
          with hr_opener.open(base + "/jobs/summary", timeout=30) as response:
              summaries = json.load(response)
          with hr_opener.open(base + "/screening/candidates", timeout=30) as response:
              candidates = json.load(response)
          assert isinstance(summaries, list), "HR job summary endpoint returned an invalid response"
          assert isinstance(candidates, list), "HR candidate list endpoint returned an invalid response"
          print(f"HR login and review checks passed; {len(summaries)} job(s) summarized.")

          request = urllib.request.Request(
              base + "/chat/policy",
              data=json.dumps({"question": "What is the remote work policy?"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with opener.open(request, timeout=180) as response:
              policy = json.load(response)
          assert policy.get("answer", "").strip(), "policy endpoint returned no answer"
          assert policy.get("grounded") is True, "policy answer was not grounded"
          assert policy.get("sources"), "policy answer did not cite retrieved sources"
          print("Policy RAG returned a grounded answer with source references.")
          PY

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## HR Recruitment app deployed"
            echo ""
            echo "- Frontend: ${FRONTEND_URL}"
            echo "- Backend health: ${API_URL}/health"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
